# Copy to .github/workflows/brotni-campaign.yml
#
# On every PR labeled `brotni-simulation-candidate`, build the image and submit
# it as a campaign candidate for work item #482, publishing a campaign-scoped
# check and PR comment with a comparison link.
name: Brotni simulation campaign

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  packages: write
  pull-requests: write
  checks: write

jobs:
  simulate-candidate:
    if: contains(github.event.pull_request.labels.*.name, 'brotni-simulation-candidate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}

      - name: Register candidate in the Brotni campaign
        uses: BROTNI/brotni-github-action@v1
        with:
          brotni-api-url: ${{ secrets.BROTNI_API_URL }}
          brotni-token: ${{ secrets.BROTNI_TOKEN }}
          campaign-id: ${{ vars.BROTNI_CAMPAIGN_ID }}
          execution-recipe: scenarios/campaign-golden-path/runtime.container-service.yaml
          artifact-uri: ghcr.io/${{ github.repository }}
          artifact-digest: ${{ steps.build.outputs.digest }}
          source-kind: container_image
          candidate-label: brotni-simulation-candidate
          publish-check: "true"
          publish-comment: "true"

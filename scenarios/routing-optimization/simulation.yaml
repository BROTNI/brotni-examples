# scenarios/routing-optimization/simulation.yaml
#
# End-to-end scenario: compare a latency-aware routing algorithm
# against the current nearest-node baseline.
#
# Run with:
#   brotni simulate run --simulation scenarios/routing-optimization/simulation.yaml --dry-run

apiVersion: brotni.dev/v1
kind: SimulationCampaign

metadata:
  name: routing-optimization
  description: >
    Compare latency-aware routing (challenger) against nearest-node routing (baseline).
    Uses a synthetic burst workload to surface hot-node routing problems.

candidates:
  - id: baseline
    image: ghcr.io/brotni-examples/routing-service:nearest-node
    role: baseline
    description: Nearest-node algorithm — current production behavior

  - id: challenger
    image: ghcr.io/brotni-examples/routing-service:latency-aware
    role: challenger
    description: Latency-aware algorithm — routes away from hot nodes

runtime:
  type: container-service
  container:
    ports:
      - name: http
        containerPort: 8080
    env:
      - name: ENV
        value: simulation
      - name: NODE_COUNT
        value: "10"
      - name: LOG_LEVEL
        value: info
    resources:
      requests:
        cpu: "500m"
        memory: "256Mi"
      limits:
        cpu: "2000m"
        memory: "512Mi"
  readiness:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 2
    failureThreshold: 10

context:
  type: synthetic
  config:
    env:
      NODE_COUNT: "10"
      SIMULATED_HOT_NODES: "2,7"  # nodes 2 and 7 are artificially loaded
  isolation:
    networkPolicy: deny-external
    clonePerCandidate: true

replay:
  source:
    type: dataset
    path: datasets/sample-events/routing-requests.jsonl
  speedFactor: 0
  # This dataset contains 10,000 requests with burst patterns
  # designed to trigger hot-node problems.

scoring:
  strategy: compare
  kpis:
    - name: p99_latency_ms
      metric: http_request_duration_p99
      unit: ms
      direction: lower_is_better
      weight: 0.6
      description: "Primary KPI — latency-aware routing should reduce tail latency"

    - name: p50_latency_ms
      metric: http_request_duration_p50
      unit: ms
      direction: lower_is_better
      weight: 0.2

    - name: error_rate
      metric: http_error_rate
      unit: ratio
      direction: lower_is_better
      weight: 0.2

  promotionThreshold:
    minScoreImprovement: 0.05  # 5% improvement required

notifications:
  githubPrComment: true
  failOnNoImprovement: false

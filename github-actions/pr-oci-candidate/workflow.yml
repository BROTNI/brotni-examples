# github-actions/pr-oci-candidate/workflow.yml
#
# Copy this file to .github/workflows/simulate-pr.yml in your repository.
#
# This workflow builds an OCI image for the PR branch, submits it as a
# challenger candidate to Brotni, and posts results as a PR comment.

name: Simulate PR candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: write  # required for posting PR comments

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  simulate:
    name: Build and simulate
    runs-on: ubuntu-latest

    steps:
      # ─── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Build OCI image ───────────────────────────────────────────────────
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ─── Run simulation ────────────────────────────────────────────────────
      - name: Install Brotni CLI
        run: curl -sSL https://get.brotni.dev/install.sh | sh
        # For dry-run testing without installing: use --dry-run flag below

      - name: Submit simulation
        id: simulate
        env:
          BROTNI_API_TOKEN: ${{ secrets.BROTNI_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHALLENGER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
        run: |
          brotni simulate run \
            --simulation .brotni/simulation.yaml \
            --candidate id=challenger,image=${CHALLENGER_IMAGE} \
            --pr ${PR_NUMBER} \
            --output json > simulation-result.json

          # Extract key results for downstream steps
          echo "score=$(jq -r '.score' simulation-result.json)" >> $GITHUB_OUTPUT
          echo "promoted=$(jq -r '.promoted' simulation-result.json)" >> $GITHUB_OUTPUT

      # ─── Post results ──────────────────────────────────────────────────────
      - name: Post simulation results to PR
        uses: actions/github-script@v7
        with:
          script: |
            const result = require('./simulation-result.json');
            const score = result.score ?? 'N/A';
            const promoted = result.promoted ? '✅ Candidate beats baseline' : '⚠️ No improvement detected';

            const body = [
              '## Brotni simulation results',
              '',
              `**Status:** ${promoted}`,
              `**Weighted score:** ${score}`,
              '',
              '| KPI | Baseline | Challenger | Delta |',
              '|-----|----------|------------|-------|',
              ...(result.kpis ?? []).map(k =>
                `| ${k.name} | ${k.baseline} | ${k.challenger} | ${k.delta} |`
              ),
              '',
              `[View full report](${result.reportUrl ?? '#'})`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

# github-actions/pr-oci-candidate/simulation.yaml
#
# Simulation spec used by the pr-oci-candidate workflow.
# Place this at .brotni/simulation.yaml in your own repository,
# or adjust the --simulation path in the workflow.

apiVersion: brotni.dev/v1
kind: SimulationCampaign

metadata:
  name: pr-candidate-simulation
  description: Compare PR candidate OCI image against the main branch baseline

candidates:
  - id: baseline
    image: ghcr.io/${GITHUB_REPOSITORY}:main
    role: baseline

  - id: challenger
    # Image is injected by the workflow via --candidate flag.
    # This value is a placeholder; the CLI overrides it at runtime.
    image: ghcr.io/${GITHUB_REPOSITORY}:pr-${PR_NUMBER}
    role: challenger

runtime:
  type: container-service
  container:
    ports:
      - name: http
        containerPort: 8080
    env:
      - name: ENV
        value: simulation
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
  readiness:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 2
    failureThreshold: 15

context:
  type: snapshot-clone
  isolation:
    networkPolicy: deny-external
    clonePerCandidate: true

replay:
  source:
    type: dataset
    # Replace with your own event dataset or a live capture reference.
    path: datasets/sample-events/http-requests.jsonl
  speedFactor: 0

scoring:
  strategy: compare
  kpis:
    - name: p99_latency_ms
      metric: http_request_duration_p99
      unit: ms
      direction: lower_is_better
      weight: 0.5
    - name: error_rate
      metric: http_error_rate
      unit: ratio
      direction: lower_is_better
      weight: 0.3
    - name: cost_per_request
      metric: estimated_cost_per_request
      unit: usd
      direction: lower_is_better
      weight: 0.2
  promotionThreshold:
    minScoreImprovement: 0.01

notifications:
  githubPrComment: true
  failOnNoImprovement: false
